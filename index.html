    image-rendering: auto; will-change: transform;

    font-weight: 400;
    font-size: clamp(2.5rem, 10vw, 5rem);
    color: var(--ink);
    text-align: center;
  }
  footer {
    position: fixed; left: 0; right: 0; bottom: 1.5rem;
    padding: 0 16px;
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(0.75rem, 2.3vw, 1rem);
    color: var(--ink);
    text-align: center;
  }
